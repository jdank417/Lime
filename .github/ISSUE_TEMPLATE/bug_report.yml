name: Bug report
description: Something in Lime isn't working right.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: Kind of file
      description: Format and roughly how big, e.g. "HEIC photo, 3 MB". Please don't attach anything private.
  - type: input
    id: action
    attributes:
      label: Format or tool you picked
      placeholder: e.g. JPG, Trim, Compress
  - type: input
    id: message
    attributes:
      label: Message shown in the island
      description: If a job failed, the message at the top of the screen helps a lot.
  - type: input
    id: lime-version
    attributes:
      label: Lime version
      description: Shown in Lime → About.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
