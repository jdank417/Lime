# Push a tag like v1.0.0 to test, build Lime.dmg and publish it as a GitHub Release.
# Signing and notarizing switch on when the secrets listed in docs/RELEASING.md are set.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      HAS_CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the newest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Test
        run: |
          xcodebuild test -project Lime.xcodeproj -scheme Lime -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM="" ENABLE_HARDENED_RUNTIME=NO

      - name: Import the Developer ID certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Write the notary API key
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build the DMG
        id: build
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION=""
          scripts/build-dmg.sh $VERSION

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published by hand (e.g. a DMG notarized locally) is left untouched.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as is."
            exit 0
          fi
          NOTE=""
          if [[ "${{ steps.build.outputs.notarized }}" != "true" ]]; then
            NOTE=$'This build is not notarized yet. The first time you open Lime, macOS will warn you; go to **System Settings → Privacy & Security** and click **Open Anyway**.\n\n'
          fi
          gh release create "$GITHUB_REF_NAME" build/Lime.dmg \
            --title "Lime ${GITHUB_REF_NAME#v}" \
            --notes "${NOTE}Download **Lime.dmg** below, open it, and drag Lime into Applications. Requires macOS 26 or later." \
            --generate-notes

      - name: Keep the DMG from a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Lime-dmg
          path: build/Lime.dmg
